[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,assets/training_room/*.json,generated/streaming/*.json,generated/training_room/*.json"
exclude_filter="tools/*,tests/*,generated/build_report.json,generated/globe.tscn,generated/neighborhood.tscn,generated/districts/*,generated/presets/*,assets/character/graduate.glb,assets/character/graduate_jump.glb,assets/training_room/wordking_training_room.glb,assets/training_room/wordking_training_room_starry_night.jpg,assets/training_room/textures/starry_night.jpg,assets/character/runtime_pca/*"
export_path="../build/web/index.html"

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

[preset.1]
name="Windows Low"
platform="Windows Desktop"
runnable=true
custom_features="low_end"
export_filter="all_resources"
include_filter="data/*.json,assets/training_room/*.json,generated/streaming/*.json,generated/training_room/*.json"
exclude_filter="tools/*,tests/*,generated/build_report.json,generated/globe.tscn,generated/neighborhood.tscn,generated/districts/*,generated/presets/*,assets/character/graduate.glb,assets/character/graduate_jump.glb,assets/training_room/wordking_training_room.glb,assets/training_room/wordking_training_room_starry_night.jpg,assets/training_room/textures/starry_night.jpg,assets/character/runtime_pca/*"
export_path="../build/windows-low/LittleWorld.exe"

[preset.1.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=false

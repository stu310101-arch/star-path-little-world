[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,assets/training_room/*.json,generated/streaming/*.json"
exclude_filter="tools/*,tests/*,generated/build_report.json,generated/globe.tscn,generated/neighborhood.tscn,generated/districts/*,generated/presets/*"
export_path="../build/web/index.html"

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
